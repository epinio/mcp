name: epinio-mcp

configuration:
  instances: 1
  # Core install uses the stock `standard` appchart. The MCP talks only to the
  # Epinio REST API as the calling user, so it needs no extra cluster RBAC.
  # The elevated tier (workload adoption) reaches into Kubernetes and uses
  # epinio-elevated.yml + `make elevated-setup` instead.
  appchart: standard
  environment:
    # EDIT before pushing — set these to your Epinio cluster values.
    EPINIO_API_URL: "https://epinio.apps-dev.internal.krum.io"
    # The URL users type into their MCP client. Must match exactly: clients
    # compare it against the metadata document and refuse a mismatch. This is
    # the route Epinio gives the app, <app-name>.<epinio-domain>.
    EPINIO_MCP_RESOURCE_URL: "https://epinio-mcp.apps-dev.internal.krum.io"
    # The Dex issuer fronting this Epinio, normally https://auth.<your-domain>.
    EPINIO_MCP_OIDC_ISSUER: "https://auth.apps-dev.internal.krum.io"
    # No server credentials. Every caller authenticates as themselves against
    # Epinio; a caller without an Epinio account gets no tools.

staging:
  builder: "paketobuildpacks/builder-jammy-full:0.3.606"
