apiVersion: application.epinio.io/v1
kind: Service
metadata:
  name: s3-gateway
  namespace: epinio
spec:
  name: s3-gateway
  shortDescription: S3 gateway proxy to an existing SeaweedFS filer
  description: |
    Deploys only the SeaweedFS S3 gateway component, configured to proxy
    requests to an existing SeaweedFS filer. Use this to give apps in any
    namespace S3 access to Epinio's internal blob storage without needing
    direct access to the epinio-s3-connection-details configuration.

    The gateway is stateless — it translates S3 API calls into filer
    operations against the target SeaweedFS instance.

    More info: https://github.com/seaweedfs/seaweedfs
  chart: seaweedfs
  chartVersion: 4.0.412
  serviceIcon: https://raw.githubusercontent.com/seaweedfs/seaweedfs/master/note/seaweedfs.png
  appVersion: 4.0.412
  helmRepo:
    name: seaweedfs
    url: "https://seaweedfs.github.io/seaweedfs/helm"
  settings:
    "s3.replicas":
      type: "integer"
      minimum: "1"
      maximum: "3"
    "s3.enableAuth":
      type: "bool"
    "s3.existingConfigSecret":
      type: "string"
  values: |-
    global:
      enableSecurity: false
      createClusterRole: false
      # Use a unique name to avoid colliding with the pre-existing "default"
      # and "seaweedfs" SAs in the epinio namespace. The chart's
      # service-account.yaml has no create guard so it always renders one.
      serviceAccountName: seaweedfs-s3-gateway
    master:
      enabled: false
    volume:
      enabled: false
    filer:
      enabled: false
    s3:
      enabled: true
      port: 8333
      enableAuth: false
      extraArgs:
        - "-filer=seaweedfs-filer-client.epinio.svc.cluster.local:8888"
