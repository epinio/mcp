# Chart server for Epinio custom AppCharts.
#
# A minimal nginx pod that serves the `epinio-application-0.1.26.tgz` Helm chart
# from a ConfigMap, so `standard-elevated` (and any future custom AppCharts that
# reference `http://chart-server.epinio.svc.cluster.local/charts/...`) can pull
# without touching GitHub.
#
# Apply once per cluster that runs a custom AppChart:
#
#   kubectl apply -f manifests/chart-server.yaml
#
# The chart tgz is the upstream epinio-application-0.1.26 chart with the
# per-app ServiceAccount template extended for `apps.application.epinio.io`
# read access — paired with manifests/standard-elevated-appchart.yaml.
apiVersion: v1
binaryData:
  chart.tgz: 
kind: ConfigMap
metadata:
  name: epinio-mcp-chart
  namespace: epinio
---
apiVersion: v1
kind: Service
metadata:
  name: chart-server
  namespace: epinio
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: chart-server
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: chart-server
  name: chart-server
  namespace: epinio
spec:
  containers:
  - image: nginx:alpine
    name: nginx
    ports:
    - containerPort: 80
      protocol: TCP
    volumeMounts:
    - mountPath: /usr/share/nginx/html/charts
      name: chart
  volumes:
  - configMap:
      items:
      - key: chart.tgz
        path: epinio-application-0.1.26.tgz
      name: epinio-mcp-chart
    name: chart
